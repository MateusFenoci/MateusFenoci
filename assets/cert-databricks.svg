<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Databricks Certified Data Engineer Associate">
  <defs>
    <radialGradient id="cbg" cx="22%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#1b2634"/><stop offset="100%" stop-color="#0b1017"/>
    </radialGradient>
    <linearGradient id="cred" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5b3d"/><stop offset="100%" stop-color="#d92b0f"/>
    </linearGradient>
    <radialGradient id="cmed" cx="34%" cy="26%" r="76%">
      <stop offset="0%"  stop-color="#ffb99a"/>
      <stop offset="38%" stop-color="#ff5b3d"/>
      <stop offset="76%" stop-color="#c62b10"/>
      <stop offset="100%" stop-color="#8a1c06"/>
    </radialGradient>
    <linearGradient id="cshine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="csoft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .ct  { font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
      .cti { font-size:19px; font-weight:800; fill:#f2f7fc; letter-spacing:.01em }
      .csb { font-size:12.5px; fill:#93a7bb }
      .ctg { font-size:10px; font-weight:700; fill:#ff8b6d; letter-spacing:.16em }
      .cvf { font-size:10.5px; fill:#6f8296 }
    </style>
  </defs>

  <rect width="900" height="150" rx="14" fill="url(#cbg)"/>
  <rect x="0" y="0" width="5" height="150" rx="2.5" fill="url(#cred)"/>

  <!-- medalha -->
  <g>
    <circle cx="86" cy="75" r="47" fill="#ff5b3d" opacity=".16" filter="url(#csoft)">
      <animate attributeName="opacity" values=".10;.28;.10" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="86" cy="75" r="38" fill="url(#cmed)" stroke="#ffb99a" stroke-width="1.2" stroke-opacity=".55"/>
    <circle cx="86" cy="75" r="30" fill="none" stroke="#5c1405" stroke-opacity=".38" stroke-width="1"/>
    <path d="M86 37 A38 38 0 0 0 48 75 A38 38 0 0 1 86 37 Z" fill="url(#cshine)"/>
    <ellipse cx="73" cy="59" rx="13" ry="8" fill="#fff" opacity=".26" transform="rotate(-28 73 59)"/>
    <!-- check -->
    <path d="M70 76 l11 11 21 -23" fill="none" stroke="#fff" stroke-width="5.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- texto -->
  <text x="150" y="52"  class="ct ctg">CERTIFICA&#199;&#195;O OFICIAL</text>
  <text x="150" y="80"  class="ct cti">Databricks Certified Data Engineer Associate</text>
  <text x="150" y="102" class="ct csb">Emitida por Databricks &#183; credencial verific&#225;vel</text>
  <text x="150" y="124" class="ct cvf">credential.net &#8594; clique no selo para validar</text>
</svg>
