<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="Fluxo de dados: SAP ECC/BW refinado em camadas Bronze, Silver e Gold ate o Power BI">
  <defs>
    <!-- fundo com profundidade -->
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#141d28"/><stop offset="100%" stop-color="#0b1017"/>
    </radialGradient>

    <!-- metais: radial deslocado = luz vindo do alto-esquerda -->
    <radialGradient id="mBronze" cx="34%" cy="28%" r="78%">
      <stop offset="0%"  stop-color="#f0a86a"/>
      <stop offset="42%" stop-color="#c1743a"/>
      <stop offset="78%" stop-color="#8a4a1e"/>
      <stop offset="100%" stop-color="#5c2f12"/>
    </radialGradient>
    <radialGradient id="mSilver" cx="34%" cy="28%" r="78%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cfdae5"/>
      <stop offset="76%" stop-color="#8d9dad"/>
      <stop offset="100%" stop-color="#5d6b7a"/>
    </radialGradient>
    <radialGradient id="mGold" cx="34%" cy="28%" r="78%">
      <stop offset="0%"  stop-color="#fff3b0"/>
      <stop offset="38%" stop-color="#f5c518"/>
      <stop offset="74%" stop-color="#c28d00"/>
      <stop offset="100%" stop-color="#8a6100"/>
    </radialGradient>

    <!-- brilho especular que atravessa o disco -->
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gSap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38b4e8"/><stop offset="100%" stop-color="#0a5c85"/>
    </linearGradient>
    <linearGradient id="gBi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe57a"/><stop offset="100%" stop-color="#e0a000"/>
    </linearGradient>

    <!-- trilho com energia correndo -->
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a9fd6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4dd0e1" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#f2c811" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .t   { font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
      .cap { font-size:11px; fill:#7f93a8; letter-spacing:.16em; }
      .med { font-size:13.5px; font-weight:800; letter-spacing:.1em; }
      .rot { font-size:9.5px; fill:#93a7bb; letter-spacing:.05em; }
      .end { font-size:12.5px; font-weight:700; fill:#eaf2fa; }
      .sm  { font-size:9.5px; fill:#c9d8e6; }
      .fo  { font-size:11px; fill:#8fa3b8; }
      @media (prefers-reduced-motion: reduce) { .anim { display:none } }
    </style>
  </defs>

  <rect width="900" height="268" rx="16" fill="url(#bg)"/>
  <text x="36" y="34" class="t cap">MATÉRIA-PRIMA  →  REFINO EM CAMADAS  →  DECISÃO</text>

  <!-- ===== trilho unico, sequencial ===== -->
  <path id="rail" d="M162 130 H 792" stroke="#1e2c3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M162 130 H 792" stroke="url(#flow)" stroke-width="3" fill="none" stroke-linecap="round" class="anim">
    <animate attributeName="stroke-dasharray" values="0 640; 150 640; 0 640" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0; -640" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- ===== SAP (origem) ===== -->
  <g>
    <rect x="34" y="102" width="128" height="56" rx="12" fill="url(#gSap)" stroke="#2f4a5e" stroke-width="1.5"/>
    <text x="98" y="126" class="t end" text-anchor="middle">SAP ECC / BW</text>
    <text x="98" y="143" class="t sm" text-anchor="middle">dado bruto</text>
  </g>

  <!-- ===== BRONZE ===== -->
  <g>
    <ellipse cx="286" cy="176" rx="46" ry="9" fill="#000" opacity=".45" filter="url(#soft)"/>
    <circle cx="286" cy="130" r="46" fill="#e08a45" opacity=".16" filter="url(#soft)" class="anim">
      <animate attributeName="opacity" values=".10;.26;.10" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="286" cy="130" r="41" fill="url(#mBronze)" stroke="#f0b382" stroke-width="1.2" stroke-opacity=".5"/>
    <circle cx="286" cy="130" r="33" fill="none" stroke="#3d1f0a" stroke-opacity=".4" stroke-width="1"/>
    <path d="M286 89 A41 41 0 0 0 245 130 A41 41 0 0 1 286 89 Z" fill="url(#shine)"/>
    <ellipse cx="272" cy="112" rx="15" ry="9" fill="#fff" opacity=".2" transform="rotate(-28 272 112)"/>
    <text x="286" y="136" class="t med" text-anchor="middle" fill="#2e1607">BRONZE</text>
  </g>

  <!-- ===== SILVER ===== -->
  <g>
    <ellipse cx="453" cy="176" rx="46" ry="9" fill="#000" opacity=".45" filter="url(#soft)"/>
    <circle cx="453" cy="130" r="46" fill="#dfe9f2" opacity=".16" filter="url(#soft)" class="anim">
      <animate attributeName="opacity" values=".10;.26;.10" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="453" cy="130" r="41" fill="url(#mSilver)" stroke="#ffffff" stroke-width="1.2" stroke-opacity=".55"/>
    <circle cx="453" cy="130" r="33" fill="none" stroke="#4a5765" stroke-opacity=".38" stroke-width="1"/>
    <path d="M453 89 A41 41 0 0 0 412 130 A41 41 0 0 1 453 89 Z" fill="url(#shine)"/>
    <ellipse cx="439" cy="112" rx="15" ry="9" fill="#fff" opacity=".38" transform="rotate(-28 439 112)"/>
    <text x="453" y="136" class="t med" text-anchor="middle" fill="#1b242e">SILVER</text>
  </g>

  <!-- ===== GOLD ===== -->
  <g>
    <ellipse cx="620" cy="176" rx="46" ry="9" fill="#000" opacity=".45" filter="url(#soft)"/>
    <circle cx="620" cy="130" r="48" fill="#ffd34d" opacity=".2" filter="url(#soft)" class="anim">
      <animate attributeName="opacity" values=".12;.34;.12" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="130" r="41" fill="url(#mGold)" stroke="#fff3b0" stroke-width="1.3" stroke-opacity=".65"/>
    <circle cx="620" cy="130" r="33" fill="none" stroke="#5c4200" stroke-opacity=".4" stroke-width="1"/>
    <path d="M620 89 A41 41 0 0 0 579 130 A41 41 0 0 1 620 89 Z" fill="url(#shine)"/>
    <ellipse cx="606" cy="112" rx="15" ry="9" fill="#fff" opacity=".42" transform="rotate(-28 606 112)"/>
    <text x="620" y="136" class="t med" text-anchor="middle" fill="#2b1f00">GOLD</text>
  </g>

  <!-- ===== POWER BI (destino) ===== -->
  <g>
    <rect x="792" y="102" width="76" height="56" rx="12" fill="url(#gBi)" stroke="#7a5c00" stroke-width="1.5"/>
    <g transform="translate(830,124)">
      <rect x="-17" y="-8" width="8" height="16" rx="1.6" fill="#3d2f00" opacity=".8"/>
      <rect x="-4"  y="-14" width="8" height="22" rx="1.6" fill="#3d2f00" opacity=".8"/>
      <rect x="9"   y="-19" width="8" height="27" rx="1.6" fill="#3d2f00" opacity=".8"/>
    </g>
    <text x="830" y="150" class="t" font-size="10.5" font-weight="700" text-anchor="middle" fill="#3d2f00">POWER BI</text>
  </g>

  <!-- ===== particulas: refinam de cor a cada etapa ===== -->
  <g class="anim" filter="url(#glow)">
    <circle r="4.6" fill="#4dd0e1">
      <animateMotion dur="5.2s" repeatCount="indefinite" keyPoints="0;0.2" keyTimes="0;1" calcMode="linear"><mpath href="#rail"/></animateMotion>
      <animate attributeName="fill" values="#4dd0e1;#e08a45" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.6" fill="#e08a45">
      <animateMotion dur="5.2s" begin="1.3s" repeatCount="indefinite" keyPoints="0.2;0.46" keyTimes="0;1" calcMode="linear"><mpath href="#rail"/></animateMotion>
      <animate attributeName="fill" values="#e08a45;#dfe9f2" dur="5.2s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.6" fill="#dfe9f2">
      <animateMotion dur="5.2s" begin="2.6s" repeatCount="indefinite" keyPoints="0.46;0.73" keyTimes="0;1" calcMode="linear"><mpath href="#rail"/></animateMotion>
      <animate attributeName="fill" values="#dfe9f2;#f5c518" dur="5.2s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#f5c518">
      <animateMotion dur="5.2s" begin="3.9s" repeatCount="indefinite" keyPoints="0.73;1" keyTimes="0;1" calcMode="linear"><mpath href="#rail"/></animateMotion>
    </circle>
  </g>


  <!-- legendas fora dos discos (legiveis) -->
  <text x="286" y="196" class="t rot" text-anchor="middle">como chegou</text>
  <text x="453" y="196" class="t rot" text-anchor="middle">limpo e conformado</text>
  <text x="620" y="196" class="t rot" text-anchor="middle">pronto pro negócio</text>

  <!-- chevrons reforcando a sequencia -->
  <g fill="none" stroke="#3d5570" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M362 122 l9 8 -9 8"/>
    <path d="M529 122 l9 8 -9 8"/>
    <path d="M696 122 l9 8 -9 8"/>
  </g>

  <!-- rodape -->
  <line x1="36" y1="216" x2="864" y2="216" stroke="#1b2735" stroke-width="1"/>
  <text x="36"  y="238" class="t fo">~400 tabelas Delta</text>
  <text x="196" y="238" class="t fo">·  +150 bi de linhas</text>
  <text x="356" y="238" class="t fo">·  +10 TB</text>
  <text x="462" y="238" class="t fo">·  dezenas de schemas</text>
</svg>
